name: Publish to PyPI

# Publie automatiquement sur PyPI à chaque tag vX.Y.Z, via "trusted publishing"
# (OIDC) — aucun token à stocker. Pré-requis (une seule fois, côté PyPI) :
#   pypi.org -> ton projet (ou "pending publisher") -> Publishing ->
#   Add a new trusted publisher : owner=Salemgnk, repo=claude-wrapped,
#   workflow=publish.yml.  Puis : bump la version dans pyproject.toml,
#   git tag vX.Y.Z && git push --tags.

on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # requis pour le trusted publishing OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
